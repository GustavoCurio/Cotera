name: Testes, PostgreSQL e avaliação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cotera
          POSTGRES_PASSWORD: cotera_ci_only
          POSTGRES_DB: cotera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotera -d cotera_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      COTERA_TEST_POSTGRES_URL: postgresql://cotera:cotera_ci_only@127.0.0.1:5432/cotera_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=cotera --cov-branch --cov-report=term-missing --cov-report=xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
      - run: python -m cotera evaluate --output reports/ci-evaluation.json
      # Dataset e métricas de IA são testados com cliente simulado pela suíte.
      # A baseline não constrói cliente OpenAI, mesmo se houver chave no ambiente.
      - run: python -m evals.run_llm_eval --baseline-only --output reports/ci-llm-evaluation.json
      - run: python -m evals.run_llm_eval --baseline-only --manifest evals/llm/scanned/manifest.json --output reports/ci-ocr-evaluation.json
