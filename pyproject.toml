[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotera"
version = "1.0.0"
description = "Comparação de propostas comerciais com evidências e decisão humana"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["cotera", "evals", "evals.llm"]
include-package-data = false

[tool.setuptools.package-data]
"cotera" = ["llm_pricing.json"]
"evals" = ["cases.json"]
"evals.llm" = ["*.json", "*.md", "documents/*.txt", "documents/*.pdf", "scanned/*.json", "scanned/*.txt", "scanned/*.pdf"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==1.20.2",
    "httpx==0.28.1",
    "reportlab==4.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "postgres: integração com PostgreSQL configurado por COTERA_TEST_POSTGRES_URL",
    "ocr: integração com Tesseract e idiomas por+eng",
    "slow: fluxos de interface, geração de documentos ou OCR real",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["OUT"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # O formatador quebra código; mensagens e dados documentais preservam o texto.
    "RUF001", "RUF002", "RUF003",  # Pontuação e caracteres dos exemplos em português.
]

[tool.ruff.lint.per-file-ignores]
"cotera/api.py" = ["B008"]  # FastAPI declara parâmetros por Header, File e Form.

[tool.mypy]
files = ["cotera"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cotera"]
branch = true

[tool.coverage.report]
fail_under = 90.0
show_missing = true
precision = 2
